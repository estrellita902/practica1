<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estrella · Portafolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="nav" aria-label="Secciones">
    <a href="#inicio" class="activo">Inicio</a>
    <a href="#sobre-mi">Sobre mí</a>
    <a href="#detalles">Detalles</a>
    <a href="#contacto">Contacto</a>
  </nav>

  <main class="track" id="track">
    <section class="panel" id="inicio">
      <figure class="marco">
        <img src="foto.png" alt="Retrato con suéter rojo de margaritas, en un cuarto lleno de objetos de colores">
      </figure>
      <div class="texto">
        <h1>Hola, soy<br>Estrella Ocaña</h1>
        <p class="lead">Desarrolladora de software</p>
      </div>
    </section>

    <section class="panel" id="sobre-mi">
      <div class="texto estrecho">
        <h2>Sobre mí</h2>
        <p>Dime lo que suñas para hacerlo realidad!, Puedes localizarme desde cualquier parte del mundo y me encantaria ayudarte!!</p>
      </div>
    </section>

    <section class="panel ancho" id="detalles">
      <h2 class="vertical">Detalles</h2>
      <div class="recortes">
        <figure><div class="recorte rostro" role="img" aria-label="Detalle del rostro"></div><figcaption>La mirada</figcaption></figure>
        <figure><div class="recorte fondo" role="img" aria-label="Detalle de la pared con flores y un peluche"></div><figcaption>El fondo</figcaption></figure>
        <figure><div class="recorte textura" role="img" aria-label="Detalle del suéter con margaritas"></div><figcaption>Las margaritas</figcaption></figure>
      </div>
    </section>

    <section class="panel" id="contacto">
      <div class="texto estrecho">
        <h2>Contacto</h2>
        <p>¿Quieres escribirme? 9687442557.</p>
        <p><a class="boton" href="mestrella santos 160@gmail.com">Enviar correo</a></p>
        <button class="boton secundario" id="volver" type="button">Volver al inicio</button>
      </div>
    </section>
  </main>

  <div class="progreso" aria-hidden="true"><span id="barra"></span></div>
  <script src="script.js"></script>
</body>
</html>
